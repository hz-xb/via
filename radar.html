<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ViaPro 共享雷达</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#edf1f5}
body{overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;color:#1d2a36}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
#pill{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:17px;
 background:rgba(255,255,255,.92);box-shadow:0 2px 10px rgba(23,43,63,.10);font-size:12px;font-weight:600}
#pill i{width:7px;height:7px;border-radius:50%;background:#00b2a2;box-shadow:0 0 0 3px rgba(0,178,162,.18)}
#cnt{font-weight:400;color:#5d6f7d}
#legend{display:flex;gap:12px;height:26px;padding:0 11px;border-radius:13px;align-items:center;font-size:11px;
 background:rgba(255,255,255,.86);box-shadow:0 2px 8px rgba(23,43,63,.08);color:#42545f}
.tri{width:0;height:0;border-left:6px solid #e2493d;border-top:4px solid transparent;border-bottom:4px solid transparent;margin-right:4px}
.sq{width:8px;height:5px;border-radius:1.5px;background:#e08a2e;margin-right:4px}
#bar{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:8px}
#bar button{width:38px;height:38px;border:0;border-radius:12px;font-size:15px;color:#22323f;
 background:rgba(255,255,255,.94);box-shadow:0 2px 10px rgba(23,43,63,.10)}
#bar button:active{transform:scale(.96)}
#bar button.on{background:#00b2a2;color:#fff;box-shadow:0 4px 14px rgba(0,178,162,.35)}
#ref{position:absolute;left:10px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap;max-width:76vw}
#ref button{border:0;padding:7px 12px;border-radius:11px;font-size:11px;color:#22323f;font-weight:500;
 background:rgba(255,255,255,.92);box-shadow:0 2px 10px rgba(23,43,63,.10)}
#ref button.on{background:#1d2a36;color:#fff}
#st{position:absolute;right:10px;bottom:12px;font-size:10px;color:#6a7c89;background:rgba(255,255,255,.9);
 padding:5px 9px;border-radius:9px;box-shadow:0 2px 8px rgba(23,43,63,.07)}
#panel{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(237,241,245,.9);z-index:9}
body.connecting #hud,body.connecting #bar,body.connecting #ref,body.connecting #st{display:none}
.card{width:min(330px,86vw);padding:22px 20px 18px;border-radius:20px;background:#fff;
 box-shadow:0 18px 50px rgba(20,40,60,.16);text-align:center}
.card h2{font-size:16px;margin-bottom:6px}
.card p{font-size:12px;color:#657683;line-height:1.75;margin-bottom:14px}
.card input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #dfe7ee;background:#f5f8fa;
 font-size:15px;color:#1d2a36;text-align:center;outline:none}
.card input:focus{border-color:#00b2a2;background:#fff}
.card button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:12px;background:#00b2a2;color:#fff;font-size:15px;font-weight:600}
.card .err{color:#cf6428;font-size:12px;margin-top:10px;line-height:1.6}
</style></head><body>
<canvas id="cv"></canvas>
<div id="hud">
 <div id="pill"><i></i>共享雷达 <span id="cnt">连接中…</span></div>
 <div id="legend">
  <span class="tri"></span>真人
  <span class="tri" style="border-left-color:#2fb36a;margin-left:6px"></span>人机
  <span class="tri" style="border-left-color:#3d7ff0;margin-left:6px"></span>队友
  <span class="sq" style="margin-left:6px"></span>载具
 </div>
</div>
<div id="bar"><button id="bIn">＋</button><button id="bOut">－</button><button id="bFollow" class="on">跟</button></div>
<div id="ref"></div>
<div id="st">未连接</div>
<div id="panel"><div class="card">
<h2>连接房主</h2>
<p id="tip">输入房主手机上的地址<br>（例如 192.168.1.23:8899）</p>
<input id="hostIn" placeholder="IP:端口" autocomplete="off" spellcheck="false">
<button id="connBtn">连接</button>
<div class="err" id="perr"></div></div></div>
<script>
const cv=document.getElementById('cv'), ctx=cv.getContext('2d',{alpha:true});
const M=[1.964015783588887,-0.010272757017461496,-5794.176906435356,0.004500284319397486,1.9953857017614751,-8700.702274435747];
const MAPURL='/map.webp', MAPNAME='特训岛';
const img=new Image(); let imgOK=false; img.onload=()=>{imgOK=true;}; img.src=MAPURL;

let W=0,H=0,DPR=1,S=0,X=0,Y=0,range=400;
let host='', state=null, prev=null, prevAt=0, curAt=0, refId=-1, follow=true, panX=0, panY=0;
const ov=document.createElement('canvas'), ovc=ov.getContext('2d');   // 网格/暗角/标尺缓存
let ovKey='';

function layout(){
 DPR=Math.min(2,devicePixelRatio||1);
 W=innerWidth; H=innerHeight;
 cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
 ctx.setTransform(DPR,0,0,DPR,0,0);
 S=Math.floor(Math.min(W-20, H*0.58, 560));
 X=Math.round((W-S)/2); Y=Math.round((H-S)/2 - H*0.03);
 ov.width=Math.round(S*DPR); ov.height=Math.round(S*DPR);
 ovc.setTransform(DPR,0,0,DPR,0,0);
 ovKey='';
}
addEventListener('resize',layout); layout();

function w2p(x,y){return [M[0]*x+M[1]*y+M[2], M[3]*x+M[4]*y+M[5]];}
function normHost(v){v=(v||'').trim().replace(/^https?:\/\//i,'').replace(/\/+$/,'');
 if(!v)return ''; if(!/:\d+$/.test(v))v+=':8899'; return 'http://'+v;}
function showPanel(m){document.body.classList.add('connecting');document.getElementById('panel').style.display='flex';
 document.getElementById('perr').textContent=m||'';}
function hidePanel(){document.body.classList.remove('connecting');document.getElementById('panel').style.display='none';}
function connect(h){ host=normHost(h); if(!host)return;
 document.getElementById('hostIn').value=host.replace(/^http:\/\//,'');
 if(location.protocol==='https:'){localStorage.setItem('vp_radar_host',host);location.href=host;return;}
 localStorage.setItem('vp_radar_host',host); hidePanel(); poll();}
function poll(){ if(!host)return;
 const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),800);
 fetch(host+'/api/state',{cache:'no-store',signal:ctl.signal}).then(r=>r.json()).then(j=>{
  clearTimeout(to); if(!j||!j.players)return;
  const now=performance.now();
  if(state){prev=state;prevAt=curAt;} else {prev=j;prevAt=now;}
  curAt=now; state=j;
  document.getElementById('st').textContent='seq '+j.seq+' · '+j.players.length;
  if(refId<0)refId=j.me.id; buildRef();
 }).catch(()=>{clearTimeout(to);
  if(!state) showPanel('连不上 '+host+'，确认房主开着共享、同一 Wi-Fi。');});}
setInterval(poll,120);

function refs(){if(!state)return[];const m=state.me,o=[m];
 for(const p of state.players) if(p.team===m.team&&p.veh!==1&&p.id!==m.id) o.push(p); return o;}
const bF=document.getElementById('bFollow');
function buildRef(){const box=document.getElementById('ref'),l=refs();
 const k=l.length+'#'+refId; if(box.dataset.k===k)return; box.dataset.k=k; box.innerHTML='';
 for(const r of l){const b=document.createElement('button');
  b.textContent=r.id===state.me.id?'我（房主）':(r.name||'队友');
  if(r.id===refId)b.className='on';
  b.onclick=()=>{refId=r.id;follow=true;bF.classList.add('on');buildRef();};
  box.appendChild(b);}}
function curRef(){const l=refs();return l.find(r=>r.id===refId)||state.me;}

// 平滑：指数逼近（40ms 时间常数），既有惯性又不拖手
function smooth(list,now){
 const k=1-Math.exp(-Math.max(0,now-curAt)/45);
 for(const p of list){
  const o=prev&&prev.players?prev.players.find(q=>q.id===p.id):null;
  if(o){p._x=p.x+(o.x-p.x)*k; p._y=p.y+(o.y-p.y)*k; p._yaw=p.yaw+(o.yaw-p.yaw)*k;}
  else {p._x=p.x;p._y=p.y;p._yaw=p.yaw;}
 }
 return list;
}

function ovlay(){ const key=range+'|'+S;
 if(ovKey===key)return; ovKey=key;
 const c=ovc; c.clearRect(0,0,S,S);
 // 网格：100m
 c.strokeStyle='rgba(255,255,255,.42)'; c.lineWidth=1;
 const step=100; for(let d=-range;d<=range;d+=step){ const t=S/2+d*(S/(2*range));
  c.beginPath();c.moveTo(t,0);c.lineTo(t,S);c.moveTo(0,t);c.lineTo(S,t);c.stroke(); }
 // 暗角
 const g=c.createRadialGradient(S/2,S/2,S*0.34,S/2,S/2,S*0.78);
 g.addColorStop(0,'rgba(18,32,44,0)');g.addColorStop(1,'rgba(18,32,44,.16)');
 c.fillStyle=g;c.fillRect(0,0,S,S);
 // 比例尺
 c.font='600 10px -apple-system,sans-serif';
 const t=range+'m', tw=c.measureText(t).width;
 c.strokeStyle='rgba(255,255,255,.95)';c.lineWidth=2.6;c.strokeText(t,S-tw-10,S-9);
 c.fillStyle='rgba(28,42,54,.8)';c.fillText(t,S-tw-10,S-9);
 // 北（小胶囊，压在地图上也看得清）
 c.fillStyle='rgba(255,255,255,.94)';
 c.beginPath(); c.roundRect(S/2-11,8,22,17,8); c.fill();
 c.fillStyle='#1f2f3c'; c.font='700 11px -apple-system,sans-serif'; c.fillText('N',S/2-3.6,21);
}

function tri(c,x,y,yaw,col,size){
 // 三角 + 白描边：小地图上那种朝向箭头
 c.save(); c.translate(x,y); c.rotate(yaw);
 c.beginPath(); c.moveTo(size,0); c.lineTo(-size*.82,size*.72); c.lineTo(-size*.82,-size*.72); c.closePath();
 c.fillStyle=col; c.fill();
 c.lineWidth=1.3; c.strokeStyle='rgba(255,255,255,.96)'; c.stroke();
 c.restore();
}

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);
 c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

function draw(ts){
 requestAnimationFrame(draw);
 if(!state) return;
 const me=curRef(); if(!me) return;
 const now=performance.now();
 smooth(state.players,now);
 me._x=me.x; me._y=me.y;

 ctx.clearRect(0,0,W,H);
 // 面板阴影（只在面板外画一次，低开销）
 ctx.save();
 ctx.shadowColor='rgba(20,38,56,.18)'; ctx.shadowBlur=26; ctx.shadowOffsetY=10;
 ctx.fillStyle='#fff'; rr(ctx,X,Y,S,S,13); ctx.fill();
 ctx.restore();

 ctx.save(); rr(ctx,X,Y,S,S,13); ctx.clip();
 // 底图：一次 drawImage 裁剪贴图（GPU 缩放，别逐帧重绘整张 2048）
 ctx.fillStyle='#dde5ec'; ctx.fillRect(X,Y,S,S);
 const ppm=2, sc=S/(2*range);
 const [mx,my]=w2p(me._x+panX, me._y+panY);
 if(imgOK){
  let sx=mx-range*ppm, sy=my-range*ppm;
  let sw=2*range*ppm, sh=sw, dx=X, dy=Y, dw=S, dh=S;
  const k=sc/ppm;                       // 源像素 -> 屏幕像素
  if(sx<0){const c=-sx; sx=0; sw-=c; dx+=c*k; dw-=c*k;}
  if(sy<0){const c=-sy; sy=0; sh-=c; dy+=c*k; dh-=c*k;}
  if(sx+sw>2048){const c=sx+sw-2048; sw-=c; dw-=c*k;}
  if(sy+sh>2048){const c=sy+sh-2048; sh-=c; dh-=c*k;}
  if(sw>0&&sh>0&&dw>0&&dh>0) ctx.drawImage(img,sx,sy,sw,sh,dx,dy,dw,dh);
 }
 ovlay();
 ctx.drawImage(ov,X,Y,S,S);

 // 目标
 const list=[];
 for(const p of state.players){ if(p.id===me.id)continue;
  const d=Math.hypot(p._x-me._x,p._y-me._y); if(d>range*1.06)continue;
  list.push({p,d}); }
 list.sort((a,b)=>a.d-b.d);
 // 聚拢：同类型 12m（人机 19m）合一个点
 const cl=[];
 for(const t of list){ let c=null;
  for(const k of cl){ if(k.veh===(t.p.veh?1:0)&&k.team===(t.p.team===state.me.team)
    &&Math.abs(k.wx-t.p._x)<(t.p.bot?19:12)&&Math.abs(k.wy-t.p._y)<(t.p.bot?19:12)){c=k;break;} }
  if(!c){c={wx:t.p._x,wy:t.p._y,veh:t.p.veh?1:0,team:t.p.team===state.me.team,bot:t.p.bot,n:0,p:t.p,d:t.d};cl.push(c);}
  c.n++; if(t.d<c.d){c.d=t.d;c.p=t.p;}
 }
 cl.sort((a,b)=>a.d-b.d);
 const boxes=[{x:X+S/2-15,y:Y+S/2-15,w:30,h:30}]; let budget=5;   // 中心留白：标签不压自己
 for(const c of cl){
  const sx=X+S/2+(c.wx-me._x-panX)*sc, sy=Y+S/2+(c.wy-me._y-panY)*sc;
  if(c.veh){
   ctx.fillStyle='#e08a2e'; ctx.strokeStyle='rgba(255,255,255,.96)'; ctx.lineWidth=1.3;
   rr(ctx,sx-6,sy-4,12,8,2.5); ctx.fill(); ctx.stroke();
  } else {
   const col=c.team?'#3d7ff0':(c.bot?'#2fb36a':'#e2493d');
   tri(ctx,sx,sy,(c.p._yaw||0)*Math.PI/180,col,c.team?5.2:6);
  }
  if(c.n>1){
   ctx.beginPath();ctx.arc(sx+8,sy-8,7,0,Math.PI*2);
   ctx.fillStyle='rgba(255,255,255,.96)';ctx.fill();
   ctx.strokeStyle=c.veh?'#e08a2e':(c.team?'#3d7ff0':(c.bot?'#2fb36a':'#e2493d'));
   ctx.lineWidth=1.2;ctx.stroke();
   ctx.font='700 9px -apple-system,sans-serif'; ctx.fillStyle='#1d2a36';
   ctx.fillText(String(c.n),sx+(c.n>9?4:6),sy-5);
  }
  if(budget>0&&c.d<range*0.94){
   let nm=c.veh?(c.p.name||'载具'):(c.p.name||(c.bot?'人机':'敌人'));
   if(nm.length>9) nm=nm.slice(0,9)+'…';
   const txt=nm+' '+Math.round(c.d)+'m';
   ctx.font='600 10px -apple-system,sans-serif';
   const tw=ctx.measureText(txt).width+12, th=17;
   const cands=[[sx+9,sy-th/2],[sx-tw-9,sy-th/2],[sx+9,sy-th-8],[sx+9,sy+8],[sx-tw-9,sy-th-8]];
   for(const q of cands){
    const lx=Math.max(X+3,Math.min(X+S-tw-3,q[0])), ly=Math.max(Y+3,Math.min(Y+S-th-3,q[1]));
    let ok=true;
    for(const b of boxes){ if(!(lx+tw<b.x||lx>b.x+b.w||ly+th<b.y||ly>b.y+b.h)){ok=false;break;} }
    if(!ok) continue;
    ctx.fillStyle='rgba(255,255,255,.9)'; rr(ctx,lx,ly,tw,th,8); ctx.fill();
    ctx.fillStyle='#20303d'; ctx.fillText(txt,lx+6,ly+12);
    boxes.push({x:lx,y:ly,w:tw,h:th}); budget--;
    break;
   }
  }
 }
 // 自己：白色光环 + 青三角
 const yaw=(me.yaw||0)*Math.PI/180;
 ctx.beginPath();ctx.arc(X+S/2,Y+S/2,11,0,Math.PI*2);
 ctx.fillStyle='rgba(0,178,162,.16)';ctx.fill();
 tri(ctx,X+S/2,Y+S/2,yaw,'#00b2a2',10);
 ctx.restore();

 // 边框（小地图那种白圈）
 ctx.lineWidth=3; ctx.strokeStyle='rgba(255,255,255,.98)'; rr(ctx,X+1.5,Y+1.5,S-3,S-3,13); ctx.stroke();
 ctx.lineWidth=1; ctx.strokeStyle='rgba(28,46,62,.12)'; rr(ctx,X+3.5,Y+3.5,S-7,S-7,11); ctx.stroke();

 // 顶部计数
 const tm=state.players.filter(p=>p.team===state.me.team&&p.veh!==1).length;
 const en=state.players.filter(p=>p.team!==state.me.team&&p.veh!==1).length;
 const vn=state.players.filter(p=>p.veh===1).length;
 document.getElementById('cnt').textContent=
  (me.id===state.me.id?'我':(me.name||'队友'))+' · '+tm+'队 / '+en+'敌 / '+vn+'车';
}
requestAnimationFrame(draw);

function setRange(v){range=Math.max(80,Math.min(900,Math.round(v/10)*10));}
document.getElementById('bIn').onclick=()=>setRange(range*1.5);
document.getElementById('bOut').onclick=()=>setRange(range/1.5);
bF.onclick=()=>{panX=0;panY=0;follow=true;bF.classList.add('on');};
let drag=null;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,px:panX,py:panY};follow=false;bF.classList.remove('on');});
cv.addEventListener('pointermove',e=>{if(!drag)return;
 panX=drag.px-(e.clientX-drag.x)/(S/(2*range)); panY=drag.py-(e.clientY-drag.y)/(S/(2*range));});
addEventListener('pointerup',()=>{drag=null;});

document.getElementById('connBtn').onclick=()=>connect(document.getElementById('hostIn').value);
document.getElementById('hostIn').addEventListener('keydown',e=>{if(e.key==='Enter')connect(e.target.value);});
if(location.protocol==='https:') document.getElementById('tip').innerHTML=
 '输入房主手机上显示的地址<br>（例如 192.168.1.23:8899）<br><span style="color:#00a193">会跳到房主手机上的页面</span>';
(function boot(){
 const q=new URLSearchParams(location.search).get('h');
 const saved=localStorage.getItem('vp_radar_host')||'';
 if(q){connect(q);return;}
 if(saved){document.getElementById('hostIn').value=saved.replace(/^http:\/\//,'');connect(saved);return;}
 showPanel('');})();
</script></body></html>
